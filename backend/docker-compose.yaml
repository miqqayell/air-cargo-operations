name: kdg

services:
  app_postgres:
    image: postgres:18.6-alpine
    restart: always
    environment:
      POSTGRES_USER: 'user'
      POSTGRES_PASSWORD: 'password'
      POSTGRES_DB: 'postgres'
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5443:5432'
    networks:
      - kdg-backend
    volumes:
      - ./postgresql/data:/var/lib/postgresql
      - ./init-scripts/sql:/docker-entrypoint-initdb.d

  app_rabbitmq:
    image: rabbitmq:4.3.6-management
    environment:
      RABBITMQ_DEFAULT_USER: 'user'
      RABBITMQ_DEFAULT_PASS: 'password'
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # MGMT
    networks:
      - kdg-backend
    volumes:
      - ./rabbitmq/data/:/var/lib/rabbitmq/
      - ./rabbitmq/log/:/var/log/rabbitmq/
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  partner-service:
    image: ksmeyers/partner-service:latest
    container_name: partner-service
    ports:
      - '8000:8000'
    environment:
      AMQP_URL: 'amqp://user:password@app_rabbitmq:5672/'
      PARTNER_EXCHANGE: 'partner-exchange'
      DEMO_ENABLED: 'true'
    depends_on:
      app_rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kdg-backend

  idp_mysql:
    image: mysql:9.7.2
    volumes:
      - ./idp_mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: 'root'
      MYSQL_DATABASE: 'keycloak'
      MYSQL_USER: 'keycloak'
      MYSQL_PASSWORD: 'password'
    ports:
      - '3307:3306'
    networks:
      - kdg-kc

  idp_keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    environment:
      KEYCLOAK_ADMIN: 'admin'
      KEYCLOAK_ADMIN_PASSWORD: 'admin'
      KC_DB: 'mysql'
      KC_DB_URL_HOST: 'idp_mysql'
      KC_DB_URL_DATABASE: 'keycloak'
      KC_DB_USERNAME: 'keycloak'
      KC_DB_PASSWORD: 'password'
    command: start-dev --import-realm
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - '8180:8080'
    depends_on:
      - idp_mysql
    networks:
      - kdg-kc

networks:
  kdg-kc:
    name: kdg-kc-network
    driver: bridge
  kdg-backend:
    name: kdg-back-network
    driver: bridge
