spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5443/postgres
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=kdg_events

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/air-freight
spring.security.oauth2.resourceserver.jwt.audiences=air-freight-api

spring.task.execution.pool.core-size=1
events.resubmission.interval=30s

flights.policy.actual-time-tolerance=5m
flights.policy.retention=7d
flights.retention.cron=0 0 * * * *
loading.policy.window-opens-before-std=12h
loading.policy.window-closes-before-etd=20m
loading.policy.max-lateral-difference-percent=10
loading.policy.offloading-check=HARD

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2

partners.exchange=partner-exchange
